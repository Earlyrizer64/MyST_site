name: Collect Traffic Data

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at midnight UTC
  workflow_dispatch:       # allows manual trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and save traffic data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p traffic_data

          # Fetch views
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/Earlyrizer64/MyST_site/traffic/views" \
            >> traffic_data/views_raw.json

          # Fetch unique visitors
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/Earlyrizer64/MyST_site/traffic/views" \
            | python3 -c "
import sys, json, csv, os
from datetime import datetime

data = json.load(sys.stdin)
file = 'traffic_data/views.csv'
exists = os.path.isfile(file)

with open(file, 'a', newline='') as f:
    writer = csv.writer(f)
    if not exists:
        writer.writerow(['date', 'views', 'unique_visitors'])
    for entry in data.get('views', []):
        writer.writerow([entry['timestamp'][:10], entry['count'], entry['uniques']])
"

      - name: Commit traffic data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add traffic_data/
          git diff --staged --quiet || git commit -m "Update traffic data $(date +%Y-%m-%d)"
          git push