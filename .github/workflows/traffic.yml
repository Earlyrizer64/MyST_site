name: Collect Traffic Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and save traffic data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p traffic_data
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/Earlyrizer64/MyST_site/traffic/views" \
            | python3 traffic_data/collect_traffic.py

      - name: Commit traffic data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add traffic_data/
          git diff --staged --quiet || git commit -m "Update traffic data $(date +%Y-%m-%d)"
          git push
