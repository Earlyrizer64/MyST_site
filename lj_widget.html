<style>
#lj-wrap { padding: 1rem 0; }
.lj-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lj-left { flex: 1; min-width: 260px; }
.lj-right { width: 200px; }
.ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ctrl-val { font-size: 13px; font-weight: 500; min-width: 48px; }
.stat-card { background: #f5f5f5; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
.stat-label { font-size: 12px; color: #888; margin: 0 0 2px; }
.stat-val { font-size: 20px; font-weight: 500; margin: 0; }
.particle-viz { width: 100%; height: 80px; border-radius: 8px; background: #f0f0f0; margin-bottom: 16px; overflow: hidden; }
@media (prefers-color-scheme: dark) {
  .stat-card { background: #2a2a2a; }
  .particle-viz { background: #2a2a2a; }
}
</style>

<div id="lj-wrap">
  <div class="lj-row">
    <div class="lj-left">
      <svg class="particle-viz" viewBox="0 0 400 80" preserveAspectRatio="xMidYMid meet">
        <circle id="p1" cx="80" cy="40" r="14" fill="#185FA5" opacity="0.85"/>
        <circle id="p2" cx="200" cy="40" r="14" fill="#185FA5" opacity="0.85"/>
        <line id="pline" x1="94" y1="40" x2="186" y2="40" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
        <text id="pdist" x="140" y="18" font-size="11" fill="#888" text-anchor="middle"></text>
      </svg>

      <div class="ctrl-row">
        <span style="font-size:13px; color:#888; width:20px;">r</span>
        <input type="range" id="rSlider" min="0.8" max="4.0" step="0.01" value="1.5" style="flex:1;">
        <span class="ctrl-val" id="rVal">1.50 σ</span>
      </div>

      <div style="position: relative; width: 100%; height: 280px;">
        <canvas id="ljChart" role="img" aria-label="Lennard-Jones potential curve">LJ potential energy vs distance.</canvas>
      </div>
    </div>

    <div class="lj-right">
      <p style="font-size:12px; color:#888; margin:0 0 6px;">Particle type</p>
      <select id="particleSel" style="width:100%; margin-bottom:10px;">
        <option value="Ar">Argon (Ar)</option>
        <option value="Ne">Neon (Ne)</option>
        <option value="Kr">Krypton (Kr)</option>
        <option value="Xe">Xenon (Xe)</option>
        <option value="CH4">Methane (CH₄)</option>
        <option value="N2">Nitrogen (N₂)</option>
        <option value="custom">Custom</option>
      </select>

      <div id="customInputs" style="display:none; margin-bottom:10px;">
        <div style="display:flex; gap:8px; margin-bottom:6px; align-items:center;">
          <label style="font-size:12px; color:#888; width:28px;">σ (Å)</label>
          <input type="number" id="sigmaIn" value="3.4" step="0.1" style="flex:1; font-size:13px;">
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:12px; color:#888; width:28px;">ε (K)</label>
          <input type="number" id="epsIn" value="120" step="1" style="flex:1; font-size:13px;">
        </div>
      </div>

      <div class="stat-card"><p class="stat-label">Energy V(r)</p><p class="stat-val" id="statE">—</p></div>
      <div class="stat-card"><p class="stat-label">r / σ</p><p class="stat-val" id="statR">—</p></div>
      <div class="stat-card"><p class="stat-label">σ (Å)</p><p class="stat-val" id="statSig">—</p></div>
      <div class="stat-card"><p class="stat-label">ε (K)</p><p class="stat-val" id="statEps">—</p></div>
      <div class="stat-card"><p class="stat-label">State</p><p class="stat-val" id="statState" style="font-size:14px;">—</p></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PARTICLES = {
  Ar:  { sigma: 3.40, eps: 120.0 },
  Ne:  { sigma: 2.75, eps: 35.7  },
  Kr:  { sigma: 3.60, eps: 171.0 },
  Xe:  { sigma: 3.96, eps: 221.0 },
  CH4: { sigma: 3.73, eps: 148.0 },
  N2:  { sigma: 3.70, eps: 95.1  },
};
function lj(r) { const x = 1/r; return 4*(Math.pow(x,12)-Math.pow(x,6)); }
function getParams() {
  const sel = document.getElementById('particleSel').value;
  if (sel === 'custom') return { sigma: parseFloat(document.getElementById('sigmaIn').value)||3.4, eps: parseFloat(document.getElementById('epsIn').value)||120 };
  return PARTICLES[sel];
}
const rPoints = [];
for (let i = 0.85; i <= 4.0; i += 0.02) rPoints.push(parseFloat(i.toFixed(3)));
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
const axisColor = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.45)';
const chart = new Chart(document.getElementById('ljChart').getContext('2d'), {
  type: 'line',
  data: {
    labels: rPoints.map(r => r.toFixed(2)),
    datasets: [
      { data: rPoints.map(r => { const v=lj(r); return (v<-1.5||v>3)?null:parseFloat(v.toFixed(4)); }), borderColor:'#185FA5', backgroundColor:'transparent', borderWidth:2, pointRadius:0, tension:0.3, spanGaps:false },
      { data: [], pointRadius:7, pointBackgroundColor:'#D85A30', pointBorderColor:'#D85A30', showLine:false, borderWidth:0 }
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{ legend:{display:false}, tooltip:{enabled:false} },
    scales:{
      x:{ title:{display:true,text:'r / σ',color:axisColor,font:{size:12}}, ticks:{color:axisColor,maxTicksLimit:8,callback:(v,i)=>rPoints[i]%0.5<0.02?rPoints[i].toFixed(1):''}, grid:{color:gridColor} },
      y:{ min:-1.5, max:3.0, title:{display:true,text:'V(r) / ε',color:axisColor,font:{size:12}}, ticks:{color:axisColor,maxTicksLimit:6}, grid:{color:gridColor} }
    }
  }
});
function getState(v,r) {
  if (v>1.5) return '⚠ Repulsive';
  if (r<1.05) return 'Hard repulsion';
  if (Math.abs(v+1)<0.05) return '✦ Equilibrium';
  if (v<0) return 'Attractive well';
  return 'Near-zero';
}
function update() {
  const r = parseFloat(document.getElementById('rSlider').value);
  const {sigma,eps} = getParams();
  const v = lj(r);
  const vC = Math.max(-1.5,Math.min(3,v));
  const idx = rPoints.findIndex(p=>Math.abs(p-r)<0.015);
  const ptData = new Array(rPoints.length).fill(null);
  if (idx>=0) ptData[idx]=parseFloat(vC.toFixed(4));
  chart.data.datasets[1].data=ptData;
  chart.update('none');
  document.getElementById('rVal').textContent=r.toFixed(2)+' σ';
  document.getElementById('statE').textContent=(v*eps).toFixed(1)+' K';
  document.getElementById('statR').textContent=r.toFixed(2);
  document.getElementById('statSig').textContent=sigma.toFixed(2);
  document.getElementById('statEps').textContent=eps.toFixed(1);
  document.getElementById('statState').textContent=getState(v,r);
  const p2x = 110 + ((r-0.8)/(4.0-0.8))*(340-110);
  document.getElementById('p2').setAttribute('cx',p2x.toFixed(1));
  document.getElementById('pline').setAttribute('x2',(p2x-14).toFixed(1));
  document.getElementById('pdist').setAttribute('x',((80+p2x)/2).toFixed(1));
  document.getElementById('pdist').textContent='r = '+r.toFixed(2)+' σ';
}
document.getElementById('rSlider').addEventListener('input',update);
document.getElementById('particleSel').addEventListener('change',()=>{
  document.getElementById('customInputs').style.display=document.getElementById('particleSel').value==='custom'?'block':'none';
  update();
});
document.getElementById('sigmaIn').addEventListener('input',update);
document.getElementById('epsIn').addEventListener('input',update);
update();
</script>
